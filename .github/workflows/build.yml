name: Build companion test package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build and run validation tests
        shell: pwsh
        run: dotnet run --project Tests/Tests.csproj
      - name: Windows UI and automatic synchronization regressions
        shell: pwsh
        run: dotnet run --project WindowsTests/WindowsTests.csproj -- --report TestArtifacts/windows-ui-results.json
      - name: Open enrollment and authenticated API regressions
        shell: pwsh
        run: python Tests/enrollment_e2e.py
      - name: Real local API and background timer integration
        shell: pwsh
        run: python Tests/background_e2e.py
      - name: Build explicitly unsigned test artifact
        shell: pwsh
        run: ./Build-Release.ps1 -AllowUnsignedTest
      - uses: actions/upload-artifact@v4
        with:
          name: ForeverSocialCompanion-UNSIGNED-TEST-win-x64
          path: dist/ForeverSocialCompanion-*-UNSIGNED-TEST-win-x64.zip
