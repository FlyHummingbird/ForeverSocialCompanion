services:
  api:
    build:
      context: .
      dockerfile: Server/Dockerfile
    image: foreversocial-api:1.1.0
    container_name: foreversocial-api
    restart: unless-stopped
    environment:
      FS_DATA: /data
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    networks: [community]
networks:
  community:
    name: foreversocial_nw
    driver: bridge
